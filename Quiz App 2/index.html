<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App 2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">


</head>

<body>
    <div aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;"></div>
    <main class="main" id="quizScreen" aria-label="Online quiz">
        <section class="quiz-card">
            <div class="quiz-content">
                <div class="question-top">
                    <div class="category" id="category">HTML</div>
                    <div class="timer-box" id="timerBox" aria-live="polite">
                        <span class="timer-icon"><i class="fa-solid fa-clock" aria-hidden="true"></i></span><span id="timer">59</span><small>sec</small>
                    </div>
                </div>
                <h2 class="question" id="question"></h2>
                <div class="options" id="options"></div>
            </div>
            <div class="quiz-bottom">
                <span class="progress-label">Progress</span>
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span class="bottom-number" id="bottomNumber">1 of 30</span>
                <button type="button" class="next-btn" id="nextBtn">Next Question <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
            </div>
        </section>
    </main>

    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal">
            <div class="modal-icon confirm-icon"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></div>
            <h2 id="confirmTitle">Are you sure you want to submit?</h2>
            <p>Your quiz will be submitted and your final result will be displayed. You can’t change your answers after submission.</p>
            <div class="modal-buttons">
                <button type="button" class="modal-btn btn-no" id="noBtn"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> No, Continue</button>
                <button type="button" class="modal-btn btn-yes" id="yesBtn"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Yes, Submit</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="modal result-modal">
            <div class="modal-icon result-icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></div>
            <h2 id="resultTitle">Quiz Submitted!</h2>
            <p class="result-subtitle">Your result has been calculated successfully.</p>
            <div class="result-score">
                <strong id="resultScore">0 / 30</strong>
                <span>Final Score</span>
            </div>
            <div class="result-stats">
                <div class="stat"><strong id="submittedCount">30</strong><span>Submitted</span></div>
                <div class="stat right"><strong id="rightCount">0</strong><span>Right</span></div>
                <div class="stat wrong"><strong id="wrongCount">0</strong><span>Wrong</span></div>
                <div class="stat skipped"><strong id="skippedCount">0</strong><span>Skipped</span></div>
            </div>
            <button type="button" class="done-btn" id="doneBtn">Done <i class="fa-solid fa-check" aria-hidden="true"></i></button>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>

</html>
