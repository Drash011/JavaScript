<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing Fuction - setInterval</title>
    <style>
        .timer-box {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
        }
        
        h1 {
            font-size: 50px;
            display: flex;
            justify-self: center;
        }
        
        button {
            padding: 8px 15px;
            margin: 0 5px;
            background-color: #000;
            border: 2px solid #000;
            color: #fff;
        }
        
        button:hover {
            background-color: #fff;
            border: 2px solid #000;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="timer-box">
        <div>
            <h1 id="timer">00:00</h1>

            <button id="start">Start</button>
            <button id="reset">Reset</button>
            <button id="stop">Stop</button>
        </div>
    </div>
    <script src="timer.js"></script>

</body>

</html>
