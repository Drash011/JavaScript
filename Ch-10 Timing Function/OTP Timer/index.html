<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background">

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>

        <div class="wave wave-left"></div>
        <div class="wave wave-right"></div>

    </div>


    <div class="otp-card">

        <div class="card-shine"></div>



        <div class="security-icon">

            <svg viewBox="0 0 24 24">

                <path d="M12 3L5 6V11C5 15.5 8 19.5 12 21C16 19.5 19 15.5 19 11V6L12 3Z">
                </path>

                <rect x="9" y="10" width="6" height="5" rx="1">
                </rect>

                <path d="M10 10V8.5C10 7.4 10.9 6.5 12 6.5C13.1 6.5 14 7.4 14 8.5V10">
                </path>

            </svg>

        </div>



        <h1>OTP</h1>

        <p class="subtitle">
            A verification code has been sent
            <br> to your mobile number
        </p>



        <div class="timer-wrapper">

            <div class="timer-ring">

                <div class="timer-inner">

                    <div id="timer">
                        01:43
                    </div>

                    <span>
                        Time remaining
                    </span>

                </div>

            </div>

        </div>



        <button id="resendBtn" disabled>

            <svg viewBox="0 0 24 24">

                <path d="M3 11.5L21 3L13 21L10 14L3 11.5Z">
                </path>

                <path d="M10 14L21 3">
                </path>

            </svg>

            <span>
                Resend OTP
            </span>

        </button>



        <div id="message" class="message">

            <svg viewBox="0 0 24 24">

                <path d="M12 3L5 6V11C5 15.5 8 19.5 12 21C16 19.5 19 15.5 19 11V6L12 3Z">
                </path>

                <path d="M9 12L11 14L15 10">
                </path>

            </svg>

            <span>
                You can resend the code after the timer ends.
            </span>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
