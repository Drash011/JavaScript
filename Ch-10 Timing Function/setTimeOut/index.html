<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summer Sale Modal</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">


</head>


<body>


    <div class="model" id="model">
        <div class="box-model">
            <button id="close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="sale-content">
                <p class="offer"> Summer Sale </p>
                <h1> SALE </h1>
                <p class="discount-label"> Up To </p>
                <div class="discount"> 70%<span> OFF </span> </div>
                <p class="description"> On all summer collections </p>
                <button class="shop-btn"> SHOP NOW <i class="fa-solid fa-arrow-right"></i></button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
